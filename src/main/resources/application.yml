spring:
  application:
    name: SmartDoc Payment Service
  datasource:
    # Persists entitlements/checkout/webhook records so a confirmed subscription
    # survives a service restart. Defaults mirror the shared SmartDoc Postgres
    # used by the other services (compose + local run).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SmartDoc}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${PAYMENT_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  # All checkout settings are env-driven so a local run can mirror the Docker
  # compose environment. Set PAYMENT_CHECKOUT_MODE=stripe + PAYMENT_STRIPE_SECRET_KEY
  # to use the real Stripe-hosted checkout (defaults keep an offline-safe mock).
  provider: ${PAYMENT_PROVIDER:stripe}
  checkout-mode: ${PAYMENT_CHECKOUT_MODE:mock}
  checkout-base-url: ${PAYMENT_CHECKOUT_BASE_URL:https://checkout.stripe.com/pay}
  checkout-return-url: ${PAYMENT_CHECKOUT_RETURN_URL:http://localhost:4200/billing/success}
  checkout-cancel-url: ${PAYMENT_CHECKOUT_CANCEL_URL:http://localhost:4200/billing/cancel}
  stripe-secret-key: ${PAYMENT_STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${PAYMENT_STRIPE_WEBHOOK_SECRET:dev-webhook-secret}
  internal-token: ${PAYMENT_INTERNAL_TOKEN:dev-internal-token}
  webhook-tolerance-seconds: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:300}
  additional-plans:
    - id: starter-pack
      name: Starter Pack
      price-cents: 999
      currency: eur
      interval: month
      active: true
  default-plan:
    id: pro-monthly
    name: SmartDoc Pro Monthly
    price-cents: 1999
    currency: eur
    interval: month
    active: true

